name: Native integration build
on:
  push:
    paths:
      - 'Sources/**'
      - 'Integration/**'
      - 'Vendor/**'
      - '.gitmodules'
      - '.github/workflows/native.yml'
  pull_request:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unsigned-build:
    runs-on: macos-15
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          submodules: recursive
      - name: Select newest installed stable Xcode
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          choices = []
          for p in Path('/Applications').glob('Xcode*.app'):
              m = re.fullmatch(r'Xcode_(\d+(?:\.\d+)*)\.app', p.name)
              if m:
                  choices.append((tuple(map(int, m[1].split('.'))), p))
          if choices:
              subprocess.run(['sudo', 'xcode-select', '-s', str(max(choices)[1] / 'Contents/Developer')], check=True)
          PY
          xcodebuild -version
          swift --version
      - name: Patch transformation tests
        run: python3 -m unittest discover -s Integration/tests -v
      - name: Verify pins and prepare native sources
        run: python3 Integration/prepare.py
      - name: Preserve prepared review sources (no binaries or Git credentials)
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import tarfile
          root = Path('.generated/SideStore')
          suffixes = {'.swift', '.h', '.m', '.c', '.cpp', '.rs', '.json', '.resolved', '.plist', '.pbxproj', '.xcconfig', '.entitlements', '.xcscheme', '.md'}
          with tarfile.open('native-review-source.tar.gz', 'w:gz') as archive:
              for path in sorted(root.rglob('*')):
                  if any(p in {'.git', '.swiftpm', 'xcuserdata'} or p.endswith('.xcframework') for p in path.parts):
                      continue
                  if path.is_file() and not path.is_symlink() and (path.suffix in suffixes or path.name == 'LICENSE'):
                      archive.add(path, arcname=str(path.relative_to(root)), recursive=False)
          PYCODE
      - name: Compile unsigned iOS app (not device validation)
        env:
          CONFIGURATION: ${{ matrix.configuration }}
        run: |
          xcodebuild build \
            -project .generated/SideStore/AltStore.xcodeproj \
            -scheme SideStore \
            -configuration "$CONFIGURATION" \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .generated/DerivedData \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES DEVELOPMENT_TEAM=XYZ0123456 \
            ORG_IDENTIFIER=com.SideStore > native-build.log 2>&1
      - name: Summarize native compiler diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('native-build.log')
          if p.exists():
              lines = p.read_text(errors='replace').splitlines()
              indices = set()
              for i, line in enumerate(lines):
                  if 'error:' in line or 'BUILD SUCCEEDED' in line or 'BUILD FAILED' in line:
                      indices.update(range(max(0, i-1), min(len(lines), i+5)))
              for i in sorted(indices)[:300]:
                  print(lines[i])
              if not indices:
                  print('\n'.join(lines[-50:]))
          PY
      - name: Package unsigned build with provenance
        env:
          CONFIGURATION: ${{ matrix.configuration }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python3 Integration/package_unsigned.py \
            --app ".generated/DerivedData/Build/Products/$CONFIGURATION-iphoneos/SideStore.app" \
            --output "artifacts/$CONFIGURATION" \
            --commit "$SOURCE_COMMIT" --configuration "$CONFIGURATION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-${{ matrix.configuration }}-${{ github.sha }}
          path: |
            artifacts/
            native-build.log
            native-review-source.tar.gz
            .generated/SideStore/TETHERLESS_PREPARATION.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
