name: Pairing composition Swift source fixtures
on:
  push:
    branches: [verify/staged-pairing-native]
    paths:
      - '.github/workflows/pairing-composition-swift.yml'
      - 'Integration/Dependencies/idevice/apply_patch.py'
      - 'Integration/Dependencies/idevice/bounded_process.py'
      - 'Integration/Native/NativeStagedPairingValidator.swift'
      - 'Integration/Native/PairingBonjourListener.swift'
      - 'Integration/Native/PairingEndpointResolver.swift'
      - 'Integration/Native/PairingSetupModel.swift'
      - 'Integration/Native/PairingSetupView.swift'
      - 'Integration/Overrides/OnboardingView.swift'
      - 'Integration/fixtures/NativeStagedPairingValidatorTests.swift'
      - 'Integration/fixtures/PairingBonjourListenerTests.swift'
      - 'Integration/fixtures/PairingCompositionPackage.swift'
      - 'Integration/fixtures/PairingEndpointResolverTests.swift'
      - 'Integration/fixtures/PairingValidationFFISpy/include/IDevice.h'
      - 'Integration/fixtures/PairingValidationFFISpy/spy.c'
      - 'Integration/tests/test_pairing_composition.py'
      - 'Integration/tests/test_verify_pairing_composition.py'
      - 'Integration/verify_pairing_composition.py'
      - 'Sources/TetherlessCore/NativeCallLifetime.swift'
      - 'Sources/TetherlessCore/PairingCancellationController.swift'
      - 'Sources/TetherlessCore/PairingNumericEndpoint.swift'
      - 'Sources/TetherlessCore/PairingPromotion.swift'
      - 'Sources/TetherlessCore/PairingRecord.swift'
      - 'Sources/TetherlessCore/PairingValidationChallenge.swift'
      - 'Sources/TetherlessCore/PrivateFileStore.swift'
      - 'Tests/TetherlessCoreTests/NativeCallLifetimeTests.swift'
      - 'Tests/TetherlessCoreTests/PairingCancellationControllerTests.swift'
      - 'Tests/TetherlessCoreTests/PairingNumericEndpointTests.swift'
      - 'Tests/TetherlessCoreTests/PairingPromotionTests.swift'
      - 'Tests/TetherlessCoreTests/PairingValidatedPromotionTests.swift'
      - 'Tests/TetherlessCoreTests/PairingValidationChallengeTests.swift'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pairing-composition-swift-${{ github.ref }}
  cancel-in-progress: false
jobs:
  swift-source-fixtures:
    if: github.ref == 'refs/heads/verify/staged-pairing-native'
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 3
        with:
          persist-credentials: false
          submodules: false
      - name: Record exact source and bounded fixture scope
        timeout-minutes: 1
        run: |
          set -euo pipefail
          test ! -e .pairing-composition-evidence
          mkdir .pairing-composition-evidence
          python3 - <<'PY'
          import json, os, platform
          from pathlib import Path
          Path('.pairing-composition-evidence/run-context.json').write_text(json.dumps({
              'source_commit': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'runner_arch': platform.machine(),
              'image_os': os.environ.get('ImageOS'),
              'image_version': os.environ.get('ImageVersion'),
              'developer_dir': os.environ['DEVELOPER_DIR'],
              'scope': '41 Swift source fixtures per configuration; synthetic C ownership spy; UIKit model/view excluded',
              'actual_idevice_ffi': False,
              'device_or_product_acceptance': False
          }, indent=2) + '\n')
          PY
      - name: Execute exact Debug and Release Swift source fixtures
        timeout-minutes: 6
        run: |
          python3 Integration/verify_pairing_composition.py \
            --source-root . --output-root .pairing-composition-evidence/fixtures
      - name: Check portable verification wrapper
        timeout-minutes: 2
        run: |
          set -euo pipefail
          python3 -m unittest discover -s Integration/tests -p test_verify_pairing_composition.py -v \
            2>&1 | tee .pairing-composition-evidence/portable-wrapper-tests.log
      - name: Retain source fixture evidence without build products
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        timeout-minutes: 2
        with:
          name: pairing-composition-swift-${{ github.sha }}-${{ github.run_attempt }}
          path: .pairing-composition-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
