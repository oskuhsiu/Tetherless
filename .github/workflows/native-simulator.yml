name: Native simulator launch
on:
  push:
    branches: [develop]
    paths:
      - 'Sources/**'
      - 'Integration/**'
      - 'Packages/**'
      - 'Vendor/**'
      - '.github/workflows/native-simulator.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-simulator-${{ github.ref }}
  cancel-in-progress: true
jobs:
  whole-app-launch:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          submodules: recursive
      - name: Select installed stable toolchain and simulator
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          choices=[]
          for path in Path('/Applications').glob('Xcode*.app'):
              match=re.fullmatch(r'Xcode_(\d+(?:\.\d+)*)\.app',path.name)
              if match: choices.append((tuple(map(int,match[1].split('.'))),path))
          if choices:
              subprocess.run(['sudo','xcode-select','-s',str(max(choices)[1]/'Contents/Developer')],check=True)
          PY
          xcodebuild -version
          xcrun simctl list devices available --json > native-simulator-devices.json
          python3 - <<'PY'
          import json, re, os
          choices=[]
          for runtime,devices in json.load(open('native-simulator-devices.json'))['devices'].items():
              match=re.search(r'iOS-(\d+(?:-\d+)*)$',runtime)
              if not match: continue
              version=tuple(map(int,match[1].split('-')))
              for device in devices:
                  if version[0]>=17 and device.get('isAvailable') and device['name'].startswith('iPhone'):
                      choices.append((version,device['name'],device['udid']))
          if not choices: raise SystemExit('No simulator: whole-app launch has NOT run')
          version,name,identifier=max(choices)
          print('Selected native simulator:',name,version,identifier)
          with open(os.environ['GITHUB_ENV'],'a') as file: file.write('SIMULATOR_ID='+identifier+'\n')
          PY
      - name: Initialize simulator and verify its screen surface
        run: python3 Integration/simulator_smoke.py prepare --simulator "$SIMULATOR_ID"
      - name: Prepare the same production integration
        run: python3 Integration/prepare.py
      - name: Build complete app for Simulator (no Apple account)
        run: |
          xcodebuild build \
            -project .generated/SideStore/AltStore.xcodeproj \
            -scheme SideStore -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath .generated/SimulatorDerived \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual AD_HOC_CODE_SIGNING_ALLOWED=YES DEVELOPMENT_TEAM=XYZ0123456 \
            ORG_IDENTIFIER=com.SideStore > native-simulator-build.log 2>&1
      - name: Verify actual simulator signature and Keychain identity
        run: |
          python3 Integration/simulator_signing.py \
            .generated/SimulatorDerived/Build/Products/Debug-iphonesimulator/SideStore.app \
            --team XYZ0123456 --output native-simulator-signing.json
      - name: Install and launch the complete app in a fresh simulator
        run: |
          python3 Integration/simulator_smoke.py launch --simulator "$SIMULATOR_ID" \
            --app .generated/SimulatorDerived/Build/Products/Debug-iphonesimulator/SideStore.app
      - name: Add UI-only test target without changing production sources
        run: python3 Integration/prepare_ui_tests.py .generated/SideStore
      - name: Exercise first setup and local navigation in the real app
        run: |
          xcodebuild test \
            -project .generated/SideStore/AltStore.xcodeproj \
            -scheme TetherlessUITests -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath .generated/SimulatorDerived \
            -resultBundlePath native-ui.xcresult \
            -parallel-testing-enabled NO \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual AD_HOC_CODE_SIGNING_ALLOWED=YES DEVELOPMENT_TEAM=XYZ0123456 \
            ORG_IDENTIFIER=com.SideStore > native-ui.log 2>&1
      - name: Retain app stdout and crash reports from the actual test result
        if: always()
        run: |
          if [ -d native-ui.xcresult ]; then
            xcrun xcresulttool export diagnostics --path native-ui.xcresult --output-path .generated/ui-diagnostics
            python3 - <<'PYCODE'
          from pathlib import Path
          import shutil
          root = Path('.generated/ui-diagnostics')
          output = Path('native-ui-diagnostics')
          output.mkdir(exist_ok=True)
          selected = [p for p in root.rglob('*') if p.is_file() and not p.is_symlink() and (
              p.name.startswith('StandardOutputAndStandardError-org.tetherless.Tetherless') or
              (p.name.startswith('SideStore-') and p.suffix in {'.ips', '.crash'}))]
          if len(selected) > 20:
              raise SystemExit('Unexpected diagnostic count')
          for index, path in enumerate(sorted(selected)):
              if path.stat().st_size > 2_097_152:
                  raise SystemExit('Unexpected diagnostic size')
              shutil.copyfile(path, output / (str(index) + '-' + path.name))
          print('Retained', len(selected), 'app-only diagnostics; no live account supplied by UI tests')
          PYCODE
          fi
      - name: Export actual UI screenshots
        if: always()
        run: |
          if [ -d native-ui.xcresult ]; then
            xcrun xcresulttool export attachments --path native-ui.xcresult --output-path native-ui-attachments
          fi
      - name: Summarize actual compiler diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['native-simulator-build.log', 'native-ui.log']:
              path=Path(name)
              if path.exists():
                  lines=path.read_text(errors='replace').splitlines()
                  selected=[line for line in lines if any(key in line for key in ['error:', 'BUILD SUCCEEDED', 'BUILD FAILED', 'TEST SUCCEEDED', 'TEST FAILED', 'Executed ', ' failed '])]
                  print(name, '\n'.join(selected[-80:] if selected else lines[-40:]))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-launch-${{ github.sha }}
          path: |
            native-simulator-signing.json
            native-ui.log
            native-ui-diagnostics
            native-ui.xcresult
            native-ui-attachments
            native-simulator-build.log
            native-simulator-launch.log
            native-simulator-devices.json
            native-launch-evidence.json
            native-first-launch.png
            native-screenshot.log
            native-simulator-prepare.log
            native-simulator-install.log
            native-simulator-home.png
          if-no-files-found: error
          retention-days: 14
