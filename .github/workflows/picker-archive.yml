name: Historical picker archive analysis
on:
  push:
    branches: [verify/staged-pairing-native]
    paths:
      - 'Integration/Diagnostics/picker_archive.py'
      - 'Integration/Diagnostics/picker_archive_tests/**'
      - '.github/workflows/picker-archive.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: historical-picker-archive-${{ github.ref }}
  cancel-in-progress: false
jobs:
  inspect-owned-archive:
    if: ${{ github.repository == 'oskuhsiu/Tetherless' && github.ref == 'refs/heads/verify/staged-pairing-native' }}
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          submodules: false
      - name: Verify portable archive and privacy contracts
        run: python3 -m unittest discover -s Integration/Diagnostics/picker_archive_tests -v
      - name: Download only the pinned historical artifact as its original ZIP
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0, official tag verified
        with:
          repository: oskuhsiu/Tetherless
          run-id: 37298228388
          artifact-ids: '11341735733'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/picker-archive-download
          skip-decompress: true
          digest-mismatch: error
      - name: Read the owned archive and export only closed-schema evidence
        run: >-
          python3 Integration/Diagnostics/picker_archive.py
          --download-dir "$RUNNER_TEMP/picker-archive-download"
          --source-root "$GITHUB_WORKSPACE"
          --output "$RUNNER_TEMP/picker-archive-report"
      - name: Retain only the sanitized report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: historical-picker-archive-${{ github.sha }}
          path: ${{ runner.temp }}/picker-archive-report/report.json
          if-no-files-found: error
          retention-days: 7
