name: Renewal core
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Toolchain identity
        run: |
          swift --version
          xcodebuild -version
          python3 --version
      - name: Debug tests
        run: swift test
      - name: Release tests
        run: swift test -c release
      - name: Retain exact tested source (no Git credentials or build caches)
        run: |
          git archive --format=tar.gz --output=verified-source.tar.gz HEAD
          git rev-parse HEAD > verified-source-commit.txt
          shasum -a 256 verified-source.tar.gz > verified-source.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-source-${{ github.sha }}
          path: |
            verified-source.tar.gz
            verified-source-commit.txt
            verified-source.sha256
          retention-days: 14
          if-no-files-found: error
