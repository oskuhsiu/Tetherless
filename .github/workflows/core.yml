name: Renewal core
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Toolchain identity
        run: |
          swift --version
          xcodebuild -version
          python3 --version
      - name: Debug tests
        run: swift test
      - name: Release tests
        run: swift test -c release
