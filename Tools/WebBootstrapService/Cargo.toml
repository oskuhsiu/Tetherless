[package]
name = "tetherless-web-bootstrap-service"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"

[dependencies]
axum = "0.8.6"
base64 = "0.22.1"
isideload = { path = "vendor/isideload", default-features = false, features = ["install", "tokio-mt"] }
rootcause = "0.12.0"
# Reuse the already locked upstream types; no TLS/client defaults are enabled.
reqwest = { version = "=0.13.5", default-features = false }
reqwest-middleware = { version = "=0.5.2", default-features = false }
openssl = "0.10.75"
plist = "1.8"
rsa = "0.9.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.10.9", features = ["oid"] }
subtle = "2.6.1"
tokio = { version = "1.49", features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower-http = { version = "0.6.6", features = ["cors", "set-header", "fs"] }
uuid = { version = "1.20", features = ["v4"] }
x509-cert = { version = "0.2.5", features = ["pem"] }
zeroize = "1.8.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[package.metadata.tetherless-upstream]
isideload-repository = "https://github.com/nab138/isideload"
isideload-revision = "8ca39b6203263e539408986e546c42e7c1cc3699"
isideload-local-patch = "bounded-no-redirect-anisette-transport"
